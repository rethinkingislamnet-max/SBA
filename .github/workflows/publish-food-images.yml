name: Publish approved food images
on:
  workflow_dispatch:
  push:
    paths:
      - 'makan-madness-sg/image-sources.json'
      - 'makan-madness-sg/build_images.py'
      - '.github/workflows/publish-food-images.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python makan-madness-sg/build_images.py
      - name: Commit approved optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add makan-madness-sg/images makan-madness-sg/image-manifest.json
          git diff --staged --quiet || (git commit -m "Publish five licensed food images" && git push)
